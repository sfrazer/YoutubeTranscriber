[project]
name = "youtubetranscriber"
version = "0.0.1"
description = "CLI tool for transcribing and summarizing YouTube videos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "TBD" }
authors = [
    { name = "Scott Frazer", email = "s.frazer@gmail.com" },
]
dependencies = [
    "faster-whisper>=1.2.1",
    "typer>=0.12",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.6.9",
]

[project.scripts]
ytx = "youtubetranscriber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtubetranscriber"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
]
# Allow the CLI to declare forward-compat flags for future phases
# (diarize, summarize, prefer_captions, keep_audio) that are not yet
# consumed in the pipeline.
per-file-ignores = { "src/youtubetranscriber/cli.py" = ["ARG", "A002"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: marks tests as slow (run with -m slow to include)",
]
